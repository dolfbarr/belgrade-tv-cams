[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catalog-probe"
version = "0.1.0"
description = "Belgrade public webcam catalog health prober and static manifest generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28.0",
]

[project.scripts]
catalog-probe = "catalog_probe.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_probe"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
