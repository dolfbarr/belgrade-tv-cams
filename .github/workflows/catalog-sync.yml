name: Catalog Health Sync & Pages Deploy

on:
  schedule:
    # Probe world camera endpoints every 6 hours
    - cron: "15 */6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "catalog/**"
      - "tools/catalog-probe/**"
      - ".github/workflows/catalog-sync.yml"
  push:
    branches:
      - main
    paths:
      - "catalog/**"
      - "tools/catalog-probe/**"
      - ".github/workflows/catalog-sync.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "catalog-pages-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-pr:
    name: Validate Community Camera Contribution (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "tools/catalog-probe/uv.lock"

      - name: Lint & test catalog-probe
        working-directory: tools/catalog-probe
        run: |
          uv run ruff check .
          uv run pytest

      - name: Verify contributed catalog/d/*.json files & stream reachability
        run: |
          uv run --project tools/catalog-probe catalog-probe --check-contributions

  probe-catalog:
    name: Probe Upstream Streams & Validate Manifest
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "tools/catalog-probe/uv.lock"

      - name: Lint & test catalog-probe
        working-directory: tools/catalog-probe
        run: |
          uv run ruff check .
          uv run pytest

      - name: Probe live world camera endpoints
        run: |
          uv run --project tools/catalog-probe catalog-probe \
            --output catalog/catalog.v5.json \
            --output app/src/main/assets/seed_catalog.v5.json

      - name: Commit updated stream ordering on schedule
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet catalog/catalog.v5.json app/src/main/assets/seed_catalog.v5.json; then
            git add catalog/catalog.v5.json app/src/main/assets/seed_catalog.v5.json
            git commit -m "chore(catalog): refresh world camera manifest health"
            git push
          fi

      - name: Upload Pages catalog artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: catalog

  deploy-pages:
    name: Publish Static Catalog to GitHub Pages
    needs: probe-catalog
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
