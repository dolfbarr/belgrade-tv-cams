name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-catalog-tools:
    name: Catalog Tooling Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "tools/catalog-probe/uv.lock"

      - name: Run ruff & pytest
        working-directory: tools/catalog-probe
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run pytest

  domain-jvm-tests:
    name: Domain Contract & State Machine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Execute domain test suite
        run: ./gradlew :domain:test

  android-tv-apk:
    name: Build Android TV Debug APK
    needs:
      - python-catalog-tools
      - domain-jvm-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble & lint Android TV APK
        run: ./gradlew :app:lintDebug :app:assembleDebug

      - name: Upload Android TV APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: belgrade-tv-cams-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
