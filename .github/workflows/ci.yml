name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-catalog-tools:
    name: Catalog Tooling Lint, Tests & Coverage (>=85%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "tools/catalog-probe/uv.lock"

      - name: Run ruff & pytest with coverage gate
        working-directory: tools/catalog-probe
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run pytest --cov=catalog_probe --cov-fail-under=85

  domain-jvm-tests:
    name: Domain Contract Tests & Coverage (>=85%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Execute domain test suite & Kover verification
        run: ./gradlew :domain:test :domain:koverVerify

  android-tv-apk:
    name: Android TV Unit/UI Tests, Coverage (>=80%), Lint & Debug/Release APKs
    needs:
      - python-catalog-tools
      - domain-jvm-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run :app unit & Robolectric Compose UI tests + Kover gate
        run: ./gradlew :app:testDebugUnitTest :app:koverVerify

      - name: Lint & assemble Debug + R8 Release APKs
        run: ./gradlew :app:lintDebug :app:assembleDebug :app:assembleRelease

      - name: Upload Android TV Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: world-live-cams-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Android TV R8 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: world-live-cams-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
